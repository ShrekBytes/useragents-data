name: Update User Agents

on:
  schedule:
    # Saturdays, 06:00 UTC. Sources publish on a weekly or 48h cadence, and Chrome
    # and Edge ship a major every two weeks, so a daily run produced nothing but
    # no-op commits — which is how this repo managed to look healthy while frozen.
    - cron: '0 6 * * 6'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scraper.py'
      - 'uadata/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/update-useragents.yml'

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # ua-parser-js is the second fidelity oracle. A build that cannot run it fails,
    # so the environment that runs the build is part of what CI has to set up.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        npm ci

    - name: Run tests
      run: python -m unittest discover -s tests -t . -q

    # A non-zero exit here means a check failed or nothing was collected. The
    # dataset is left untouched in that case and this step fails loudly, which is
    # the entire reason the workflow reports its status from the scraper rather
    # than printing its own opinion afterwards.
    - name: Build dataset
      run: python scraper.py

    - name: Check for changes and commit
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Actions"
        git add -A data/ common/ synthetic/ state/ || true

        if git diff --cached --quiet; then
          echo "No data change to commit."
          exit 0
        fi

        git commit -m "Update user agents - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        git push

    # Only reached when the scraper exited zero, so a green job means a valid
    # dataset was published. It still cannot be right that everything is fine --
    # but it can no longer be green while the data is stale and quiet.
    - name: Report source health
      if: always()
      run: |
        python .github/report.py >> "$GITHUB_STEP_SUMMARY"
        python .github/report.py --issue >> /dev/null
